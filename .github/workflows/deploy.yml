name: deploy
on:
  workflow_dispatch:
    inputs:
      migrate:
        description: 'Run D1 migrations even if none changed since the last successful deploy'
        type: boolean
        default: false
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # wrangler.toml holds placeholders so this public repo carries no deployment details.
      - name: Configure wrangler.toml
        working-directory: apps/api
        run: |
          : "${D1_DATABASE_ID:?set the D1_DATABASE_ID repo secret}" "${RISE_HOST:?set the RISE_HOST repo secret}"
          sed -i -e "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" \
            -e "s/rise\.example\.workers\.dev/$RISE_HOST/g" wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          RISE_HOST: ${{ secrets.RISE_HOST }}
      - run: pnpm --filter @rise/web build
      # Even listing applied migrations costs D1 reads, and fails outright once the free daily
      # cap is spent — which used to block releases that had no schema change at all. So only
      # touch D1 when a migration changed since the last deploy that went live (a failed deploy
      # never counts, so a migration that missed its deploy is retried by the next one), or
      # when a manual run asks for it.
      - id: migrations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          if [ "${{ inputs.migrate }}" = "true" ] || [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null \
             || ! git diff --quiet "$last" HEAD -- apps/api/migrations; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No migration changes since the last successful deploy ($last); skipping D1 migrate."
          fi
      # A migration's plan on production's planner before it runs: a backfill that reads a table
      # once per row would spend the day's allowance during the deploy itself.
      - name: Migration plans (production)
        if: steps.migrations.outputs.run == 'true'
        working-directory: apps/api
        run: node --experimental-strip-types scripts/check-plans.ts --migrations --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      # Migrations before the code that depends on them goes live.
      - if: steps.migrations.outputs.run == 'true'
        run: pnpm --filter @rise/api migrate:remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Last look before the code goes live: production's planner, after any migration, on
      # every statement CI's tests ran. Reads no rows; skipped (with a warning) when the daily
      # D1 allowance is spent or there's no catalog (a manual run).
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        with:
          name: query-catalog
          path: ${{ runner.temp }}/catalog
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Query plans (production)
        working-directory: apps/api
        run: |
          if [ -f "$RUNNER_TEMP/catalog/api-tests.log" ]; then
            node --experimental-strip-types scripts/check-plans.ts "$RUNNER_TEMP/catalog/api-tests.log" --remote
          else
            echo "::warning::No query catalog from CI; production plans not checked."
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      - run: pnpm --filter @rise/api run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
