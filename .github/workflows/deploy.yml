name: deploy
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # wrangler.toml holds placeholders so this public repo carries no deployment details.
      - name: Configure wrangler.toml
        working-directory: apps/api
        run: |
          : "${D1_DATABASE_ID:?set the D1_DATABASE_ID repo secret}" "${RISE_HOST:?set the RISE_HOST repo secret}"
          sed -i -e "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" \
            -e "s/rise\.example\.workers\.dev/$RISE_HOST/g" wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          RISE_HOST: ${{ secrets.RISE_HOST }}
      - run: pnpm --filter @rise/web build
      # Migrations before the code that depends on them goes live.
      - run: pnpm --filter @rise/api migrate:remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: pnpm --filter @rise/api run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
