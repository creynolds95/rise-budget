name: provision
on:
  workflow_dispatch:
jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create D1 database
        working-directory: apps/api
        run: npx wrangler d1 create rise || echo "already exists"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Create R2 bucket
        working-directory: apps/api
        run: npx wrangler r2 bucket create rise-backups || echo "already exists"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Never overwrite: on a live install a new JWT_SECRET signs everyone out and a new
      # TOTP_KEY breaks every authenticator code. Only secrets the Worker lacks are set.
      - name: Set JWT_SECRET and TOTP_KEY worker secrets (only if missing)
        working-directory: apps/api
        run: |
          # Fail closed: if the list can't be read, set nothing (a brand-new Worker is the
          # one expected error, and has no secrets yet).
          if ! existing=$(npx wrangler secret list 2>&1); then
            if printf '%s' "$existing" | grep -Eq 'code: 10007|does not exist'; then
              existing='[]'
            else
              echo "$existing"; echo "Could not list secrets; not setting any."; exit 1
            fi
          fi
          for name in JWT_SECRET TOTP_KEY; do
            if printf '%s' "$existing" | grep -q "\"name\": *\"$name\""; then
              echo "$name is already set; leaving it alone."
              continue
            fi
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            printf '%s' "$value" | npx wrangler secret put "$name"
          done
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
