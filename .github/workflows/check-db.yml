name: check-db
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'category_group name to check for (optional)'
        required: false
        type: string
      sync:
        description: 'Only print sync health (no names or amounts)'
        required: false
        type: boolean
        default: false
      schema:
        description: 'Only print schema, indexes, planner stats and row counts (no data)'
        required: false
        type: boolean
        default: false
      errors:
        description: 'Only print failed API requests from Workers Logs (method, path, status)'
        required: false
        type: boolean
        default: false
jobs:
  check-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # wrangler.toml holds placeholders so this public repo carries no deployment details.
      - name: Configure wrangler.toml
        working-directory: apps/api
        run: |
          : "${D1_DATABASE_ID:?set the D1_DATABASE_ID repo secret}" "${RISE_HOST:?set the RISE_HOST repo secret}"
          # Fail before anything deploys if a value was pasted with extra text, a scheme or a path.
          printf '%s' "$D1_DATABASE_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' \
            || { echo "D1_DATABASE_ID must be a bare UUID"; exit 1; }
          printf '%s' "$RISE_HOST" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$' \
            || { echo "RISE_HOST must be a bare host name, e.g. rise.example.workers.dev"; exit 1; }
          sed -i -e "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" \
            -e "s/rise\.example\.workers\.dev/$RISE_HOST/g" wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          RISE_HOST: ${{ secrets.RISE_HOST }}
      - name: Run check
        working-directory: apps/api
        run: |
          node --experimental-strip-types scripts/check-db.ts \
            ${{ inputs.name && format('--name "{0}"', inputs.name) || '' }} \
            ${{ inputs.sync && '--sync' || '' }} \
            ${{ inputs.errors && '--errors' || '' }} \
            ${{ inputs.schema && '--schema' || '' }} \
            --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
