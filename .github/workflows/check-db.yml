name: check-db
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'category_group name to check for (optional)'
        required: false
        type: string
      sync:
        description: 'Only print sync health (no names or amounts)'
        required: false
        type: boolean
        default: false
      schema:
        description: 'Only print schema, indexes, planner stats and row counts (no data)'
        required: false
        type: boolean
        default: false
      errors:
        description: 'Only print failed API requests from Workers Logs (method, path, status)'
        required: false
        type: boolean
        default: false
jobs:
  check-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run check
        working-directory: apps/api
        run: |
          node --experimental-strip-types scripts/check-db.ts \
            ${{ inputs.name && format('--name "{0}"', inputs.name) || '' }} \
            ${{ inputs.sync && '--sync' || '' }} \
            ${{ inputs.errors && '--errors' || '' }} \
            ${{ inputs.schema && '--schema' || '' }} \
            --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
