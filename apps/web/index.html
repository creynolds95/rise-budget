<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: the on-screen keyboard shrinks the layout viewport instead of just
         overlaying it, so a `fixed inset-0` bottom sheet's own content stays above it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#4A6142" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2C3A25" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- No apple-mobile-web-app-status-bar-style=black-translucent: with it, the installed iPhone
         app lays out a window one status bar shorter than the screen whenever the document itself
         isn't scrolling (it never does below lg; #app-scroll does), and nothing can draw in the
         strip left over at the bottom. Without it the app starts under the status bar and its
         window reaches the bottom edge. iOS reads this only when the app is added to the Home Screen. -->
    <meta name="apple-mobile-web-app-title" content="Rise" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <title>Rise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    />
    <style>
      /*
       * A cold PWA launch shows a blank canvas-colored screen while the JS bundle parses.
       * This covers that gap with the app icon; main.tsx fades and removes it once mounted.
       */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafaf7;
        transition: opacity 240ms ease-out;
      }
      #splash img {
        width: 160px;
        height: 160px;
        border-radius: 36px;
        animation: splash-rise 1400ms ease-in-out infinite;
      }
      @keyframes splash-rise {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img {
          animation: none;
        }
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) #splash {
          background: #14160f;
        }
      }
      html[data-theme='dark'] #splash {
        background: #14160f;
      }
    </style>
  </head>
  <body>
    <!-- On a warm cache the app can mount in a handful of milliseconds — too fast to read
         anything as a splash. main.tsx uses this to hold it visible for a minimum stretch. -->
    <script src="/boot.js"></script>
    <div id="splash" aria-hidden="true"><img src="/icon-512.png" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
