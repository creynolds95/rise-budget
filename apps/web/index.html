<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: the on-screen keyboard shrinks the layout viewport instead of just
         overlaying it, so a `fixed inset-0` bottom sheet's own content stays above it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#FAFAF7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rise" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Rise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    />
    <style>
      /*
       * A cold PWA launch shows a blank canvas-colored screen while the JS bundle parses.
       * This covers that gap with the app icon; main.tsx fades and removes it once mounted.
       */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafaf7;
        transition: opacity 240ms ease-out;
      }
      #splash img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        animation: splash-rise 1400ms ease-in-out infinite;
      }
      @keyframes splash-rise {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- On a warm cache the app can mount in a handful of milliseconds — too fast to read
         anything as a splash. main.tsx uses this to hold it visible for a minimum stretch. -->
    <script>
      window.__splashStart = Date.now();
    </script>
    <div id="splash" aria-hidden="true"><img src="/icon-192.png" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
