name = "rise"
main = "src/index.ts"
# Must not exceed what the pinned workerd binary supports (vitest-pool-workers checks this).
compatibility_date = "2026-08-15"

[[d1_databases]]
binding = "DB"
database_name = "rise"
database_id = "b123fd45-f3fc-4e68-9375-aadc953d3ecc"
migrations_dir = "migrations"

# Nightly backups (T46, ARCHITECTURE §8). Create with `wrangler r2 bucket create rise-backups`.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "rise-backups"

# Workers Static Assets: the web build, served from this same Worker (ARCHITECTURE §1). Any
# path not matching a built file falls back to index.html for client-side routing, except
# /api/*, which always reaches the Worker itself.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
RP_ID = "rise.upforbatterycalendar.workers.dev"
RP_ORIGIN = "https://rise.upforbatterycalendar.workers.dev"
RP_NAME = "Rise"
# Whose data the scheduled sync writes. Set at deploy (T47).
SIMPLEFIN_OWNER_EMAIL = ""
# Secrets (never here): JWT_SECRET, TOTP_KEY, SIMPLEFIN_ACCESS_URL (`pnpm simplefin:claim`) —
# `wrangler secret put`, or .dev.vars locally. SIMPLEFIN_MOCK=1 belongs in .dev.vars only.

[triggers]
# SimpleFIN sync 3× daily (ARCHITECTURE §6); backup nightly (§8, BACKUP_CRON in src/index.ts).
crons = ["0 8,14,22 * * *", "30 9 * * *"]
