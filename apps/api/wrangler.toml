name = "rise"
main = "src/index.ts"
# Must not exceed what the pinned workerd binary supports (vitest-pool-workers checks this).
compatibility_date = "2026-08-15"

[[d1_databases]]
binding = "DB"
database_name = "rise"
# Placeholder: CI swaps in the D1_DATABASE_ID secret (see docs/SETUP.md).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Nightly backups (T46, ARCHITECTURE §8). Create with `wrangler r2 bucket create rise-backups`.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "rise-backups"

# Workers Static Assets: the web build, served from this same Worker (ARCHITECTURE §1). Any
# path not matching a built file falls back to index.html for client-side routing, except
# /api/*, which always reaches the Worker itself.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Workers Logs: cron results and errors are kept and searchable (free-plan allowance).
[observability]
enabled = true

[vars]
# Placeholders: CI swaps in the RISE_HOST secret (see docs/SETUP.md).
RP_ID = "rise.example.workers.dev"
RP_ORIGIN = "https://rise.example.workers.dev"
RP_NAME = "Rise"
# Secrets (never here): JWT_SECRET, TOTP_KEY, SIMPLEFIN_ACCESS_URL (`pnpm simplefin:claim`),
# SIMPLEFIN_OWNER_EMAIL (whose data the scheduled sync writes; a secret so it stays out of
# this public repo) —
# `wrangler secret put`, or .dev.vars locally. SIMPLEFIN_MOCK=1 belongs in .dev.vars only.

[triggers]
# SimpleFIN sync: an hourly tick that syncs in the owner's chosen hours (Settings → Bank sync,
# ARCHITECTURE §6); nightly housekeeping (§8, HOUSEKEEPING_CRON in
# src/backup/run.ts). The backup itself runs in the `backup` GitHub workflow.
crons = ["0 * * * *", "30 9 * * *"]
